name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle build --no-daemon

      - name: Check Minecraft input API (diagnostic)
        if: always()
        run: |
          CP=$(find ~/.gradle/caches -name '*.jar' | tr '\n' ':')
          echo "=== KeyboardHandler ==="
          javap -p -cp "$CP" net.minecraft.client.KeyboardHandler | grep -i "keyPress\|charTyped\|setup" || echo "not found"
          echo "=== KeyEvent ==="
          javap -p -cp "$CP" net.minecraft.client.input.KeyEvent || echo "not found"
          echo "=== Window handle ==="
          javap -p -cp "$CP" com.mojang.blaze3d.platform.Window | grep -i "handle\|getWindow" || echo "not found"
          echo "=== InputConstants ==="
          javap -p -cp "$CP" com.mojang.blaze3d.platform.InputConstants | grep -i "PRESS\|RELEASE\|REPEAT\|isKeyDown\|getKey" || echo "not found"
          echo "=== lwjgl glfw present? ==="
          find ~/.gradle/caches -name 'lwjgl-glfw*.jar' | head -2

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: skyseq-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --target "${{ github.sha }}" --title "Latest build" --notes "Latest successful build. Download the .jar file below and put it in your mods folder."
